<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Admin Dashboard{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .sidebar { min-height: 100vh; background-color: #343a40; padding-top: 20px; }
    .sidebar a { color: #fff; display: block; padding: 10px 15px; text-decoration: none; }
    .sidebar a:hover { background-color: #495057; border-radius: 5px; }
    .content { padding: 20px; }
    .card { border-radius: 12px; }
  </style>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <!-- Sidebar -->
    <nav class="col-md-3 col-lg-2 sidebar">
      <h3 class="text-white text-center mb-4">Admin Panel</h3>
      <a href="{{ url_for('admin_dashboard') }}" class="{% if request.path=='/admin' %}active{% endif %}">Dashboard</a>
      <a href="{{ url_for('manage_cars') }}" class="{% if request.path=='/admin/manage_cars' %}active{% endif %}">Manage Cars</a>
      <a href="{{ url_for('manage_customers') }}" class="{% if request.path=='/admin/manage_customers' %}active{% endif %}">Customers</a>
      <a href="{{ url_for('manage_bookings') }}" class="{% if request.path=='/admin/manage_bookings' %}active{% endif %}">Bookings</a>
      <a href="#">Payments</a>
      <a href="#">Reports</a>
      <a href="#">Settings</a>
      <a href="/logout" class="text-danger">Logout</a>
    </nav>

    <!-- Main Content -->
    <main class="col-md-9 col-lg-10 content">
      {% block content %}
      <!-- Page-specific content will go here -->
      {% endblock %}
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
