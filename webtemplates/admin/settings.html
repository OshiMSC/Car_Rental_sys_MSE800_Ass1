<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Settings</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .sidebar { min-height: 100vh; background-color: #343a40; padding-top: 20px; }
    .sidebar a { color: #fff; display: block; padding: 10px 15px; text-decoration: none; }
    .sidebar a:hover { background-color: #495057; border-radius: 5px; }
    .content { padding: 20px; }
    .card { border-radius: 12px; }
  </style>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <nav class="col-md-3 col-lg-2 sidebar">
      <h3 class="text-white text-center mb-4">Admin Panel</h3>
      <a href="{{ url_for('admin_dashboard') }}" class="{% if request.path == '/admin/dashboard' %}active{% endif %}">Dashboard</a>
      <a href="{{ url_for('manage_cars') }}" class="{% if request.path == '/admin/manage_cars' %}active{% endif %}">Manage Cars</a>
      <a href="{{ url_for('manage_customers') }}" class="{% if request.path == '/admin/manage_customers' %}active{% endif %}">Customers</a>
      <a href="{{ url_for('manage_bookings') }}" class="{% if request.path == '/admin/manage_bookings' %}active{% endif %}">Bookings</a>
      <a href="{{ url_for('payments') }}" class="{% if request.path == '/admin/payments' %}active{% endif %}">Payments</a>
      <a href="{{ url_for('reports') }}" class="{% if request.path == '/admin/reports' %}active{% endif %}">Reports</a>
      <a href="{{ url_for('settings') }}" class="{% if request.path == '/admin/settings' %}active{% endif %}">Settings</a>
      <a href="{{ url_for('logout') }}" class="text-danger">Logout</a>
    </nav>

    <main class="col-md-9 col-lg-10 content">
      <h2 class="mb-4">Settings</h2>

      <div class="card shadow-sm p-4">
        <h5>Admin Account</h5>
            <form method="POST" action="/admin/settings">
              <div class="mb-3">
                <label class="form-label">Current Password</label>
                <input type="password" name="current_password" class="form-control" placeholder="Enter current password" required>
              </div>

              <div class="mb-3">
                <label class="form-label">Admin Email</label>
                <input type="email" name="email" class="form-control" value="{{ settings.email }}" required>
              </div>

              <div class="mb-3">
                <label class="form-label">Change Password</label>
                <input type="password" name="password" class="form-control" placeholder="New password">
              </div>

              <hr>

              <h5>System Settings</h5>
              <div class="mb-3">
                <label class="form-label">Tax / Fee (%)</label>
                <input type="number" step="0.01" name="tax" class="form-control" value="{{ settings.tax }}" required>
              </div>

              <button type="submit" class="btn btn-primary">Save Settings</button>
            </form>

      </div>
    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
