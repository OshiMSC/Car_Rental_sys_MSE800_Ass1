<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - NeedAcar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body style="background-color: #f8f9fa;">

  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <nav class="col-md-3 col-lg-2 adsidebar">
        <h3 class="text-white text-center mb-4">Admin Panel</h3>
        <a href="{{ url_for('admin_dashboard') }}"
          class="{% if request.path == '/admin/dashboard' %}active{% endif %}">Dashboard</a>
        <a href="{{ url_for('manage_cars') }}"
          class="{% if request.path == '/admin/manage_cars' %}active{% endif %}">Cars</a>
        <a href="{{ url_for('manage_customers') }}"
          class="{% if request.path == '/admin/manage_customers' %}active{% endif %}">Customers</a>
        <a href="{{ url_for('admin_manage_bookings') }}"
          class="{% if request.path == '/admin/manage_bookings' %}active{% endif %}">Bookings</a>
        <a href="{{ url_for('payments') }}"
          class="{% if request.path == '/admin/payments' %}active{% endif %}">Payments</a>
        <a href="{{ url_for('reports') }}"
          class="{% if request.path == '/admin/reports' %}active{% endif %}">Reports</a>
        <a href="{{ url_for('admin_profile') }}"
          class="{% if request.path == '/admin/settings' %}active{% endif %}">Settings</a>
        <a href="{{ url_for('logout') }}" class="text-danger">Logout</a>
      </nav>

      <!-- Main Content -->
      <main class="col-md-9 col-lg-10 content">
        <div class="profile-card">
          <h4>Admin Profile</h4>
          <!-- Success / Error Messages -->
        {% include 'admin/_admin_flash_messages.html' %}

          <!-- Profile Update Form -->
          <form method="POST">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" name="full_name" value="{{ admin['full_name'] }}" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" name="email" value="{{ admin['email'] }}" required>
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-2">Update Profile</button>
          </form>

          <!-- Change Password Section -->
          <hr>
          <h4>Change Password</h4>
          <form method="POST" action="{{ url_for('change_admin_password') }}">
            <div class="row">
              <div class="col-md-6 mb-3">
                <input type="password" class="form-control" name="new_password" placeholder="New Password" required>
              </div>
              <div class="col-md-6 mb-3">
                <input type="password" class="form-control" name="confirm_password" placeholder="Confirm Password"
                  required>
              </div>
            </div>
            <button type="submit" class="btn btn-outline-primary w-100">Change Password</button>
          </form>
        </div>
      </main>
    </div>
  </div>
</body>

</html>
