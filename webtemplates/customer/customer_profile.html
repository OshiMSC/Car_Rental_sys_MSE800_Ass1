<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
     <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  
</head>
<body style="background-color: #f8f9fa;">
  <div class="container-fluid">
    <div class="row">

      <!-- Sidebar -->
      <nav class="col-md-3 col-lg-2 sidebar text-white">
        <h3 class="text-center mb-4">Customer Panel</h3>
        <a href="{{ url_for('customer_dashboard') }}" class="{% if request.path == '/customer/dashboard' %}active{% endif %}">Dashboard</a>
        <a href="{{ url_for('customer_bookings') }}" class="{% if request.path == '/customer/bookings' %}active{% endif %}">My Bookings</a>
        <a href="{{ url_for('car_calendar') }}" class="{% if request.path == '/customer/car_calendar' %}active{% endif %}">Car Availability</a>
        <a href="{{ url_for('customer_profile') }}" class="{% if request.path == '/customer/profile' %}active{% endif %}">Profile</a>
        <a href="{{ url_for('customer_payments') }}" class="{% if request.path == '/customer/payments' %}active{% endif %}">My Payments</a>
        <a href="{{ url_for('logout') }}">Logout</a>
      </nav>

      <!-- Main Content -->
      <main class="col-md-9 col-lg-10 content">
        <div class="profile-card">
          <h4>My Profile</h4>

          <!-- Profile Update Form -->
          <form method="POST">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" name="full_name" value="{{ customer['full_name'] }}" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" name="email" value="{{ customer['email'] }}" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Phone</label>
                <input type="text" class="form-control" name="phone" value="{{ customer['phone'] }}" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Address</label>
                <input type="text" class="form-control" name="address" value="{{ customer['address'] }}">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">License Number</label>
                <input type="text" class="form-control" name="license_number" value="{{ customer['license_number'] }}">
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-2">Update Profile</button>
          </form>

          <!-- Change Password Section -->
          <hr>
          <h4>Change Password</h4>
          <form method="POST" action="{{ url_for('change_customer_password') }}">
            <div class="row">
              <div class="col-md-6 mb-3">
                <input type="password" class="form-control" name="new_password" placeholder="New Password" required>
              </div>
              <div class="col-md-6 mb-3">
                <input type="password" class="form-control" name="confirm_password" placeholder="Confirm Password" required>
              </div>
            </div>
            <button type="submit" class="btn btn-outline-primary w-100">Change Password</button>
          </form>
        </div>
      </main>

    </div>
  </div>
</body>
</html>
