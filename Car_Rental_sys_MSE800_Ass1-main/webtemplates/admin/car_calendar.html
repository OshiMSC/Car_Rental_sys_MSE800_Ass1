<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Car Availability</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FullCalendar -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.9/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.9/index.global.min.js"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

  <style>
    .card {border-radius: 12px;border: 1px solid #007bff;box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);}
    .fc-daygrid-day-number {transition: box-shadow 0.2s ease-in-out;  }
    .fc-daygrid-day-number:hover {box-shadow: 0 0 4px rgba(0, 0, 0, 0.4);}
  </style>
</head>

<body style="background-color: #f8f9fa;">
  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <nav class="col-md-3 col-lg-2 adsidebar">
        <h3 class="text-white text-center mb-4">Admin Panel</h3>
        <a href="{{ url_for('admin_dashboard') }}"
          class="{% if request.path == '/admin/dashboard' %}active{% endif %}">Dashboard</a>
        <a href="{{ url_for('manage_cars') }}"
          class="{% if request.path == '/admin/manage_cars' %}active{% endif %}">Cars</a>
          <a href="{{ url_for('admin_car_calendar') }}" class="{% if request.path == '/admin/car_calendar' %}active{% endif %}">Car Availability</a>
        <a href="{{ url_for('manage_customers') }}"
          class="{% if request.path == '/admin/manage_customers' %}active{% endif %}">Customers</a>
        <a href="{{ url_for('admin_manage_bookings') }}"
          class="{% if request.path == '/admin/manage_bookings' %}active{% endif %}">Bookings</a>
        <a href="{{ url_for('payments') }}"
          class="{% if request.path == '/admin/payments' %}active{% endif %}">Payments</a>
        <a href="{{ url_for('reports') }}"
          class="{% if request.path == '/admin/reports' %}active{% endif %}">Reports</a>
        <a href="{{ url_for('admin_profile') }}"
          class="{% if request.path == '/admin/settings' %}active{% endif %}">Settings</a>
        <a href="{{ url_for('logout') }}" class="text-danger">Logout</a>
      </nav>

      <!-- Main Content -->
      <main class="col-md-9 col-lg-10 content">
        <h2 class="mb-4">Welcome, Admin</h2>
        <!-- Success / Error Messages -->
        {% include 'admin/_admin_flash_messages.html' %}

          <!-- Legend -->
          <div class="mb-3">
            <span class="badge" style="background-color:#bf6884;">Booked</span>
            <span class="badge" style="background-color:#A0EBDD; color:black;">Available</span>
          </div>

          <!-- Car Selection -->
          <div class="mb-3">
            <label for="carSelect" class="form-label">Select Car</label>
            <select id="carSelect" class="form-select">
              {% for car in cars %}
              <option value="{{ car['car_id'] }}">{{ car['make'] }} {{ car['model'] }}</option>
              {% endfor %}
            </select>
          </div>

          <!-- Calendar -->
          <div id="calendar"></div>
        </div>
      </main>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      let calendarEl = document.getElementById('calendar');
      let calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        dayCellDidMount: function (arg) {
          let dateNumberEl = arg.el.querySelector('.fc-daygrid-day-number');
          if (dateNumberEl) {
            dateNumberEl.style.backgroundColor = '#A0EBDD'; // Available = teal
            dateNumberEl.style.borderRadius = '50%';
            dateNumberEl.style.padding = '5px 8px';
            dateNumberEl.style.display = 'inline-block';
          }
        },
        eventDidMount: function (info) {
          let dateNumberEl = info.el.closest('.fc-daygrid-day')?.querySelector('.fc-daygrid-day-number');
          if (dateNumberEl) {
            dateNumberEl.style.backgroundColor = '#bf6884'; // Booked = pink
            dateNumberEl.style.color = '#000';
          }
        },
        events: [] 
      });
      calendar.render();

      async function loadBookings(carId) {
        const response = await fetch(`/api/car/${carId}/bookings`);
        const data = await response.json();
        calendar.removeAllEvents();
        calendar.addEventSource(data);
      }

      let firstCar = document.getElementById('carSelect').value;
      if (firstCar) loadBookings(firstCar);

      document.getElementById('carSelect').addEventListener('change', function () {
        loadBookings(this.value);
      });
    });
  </script>

</body>

</html>
